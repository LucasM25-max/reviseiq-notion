<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ReviseIQ</title>
<meta name="description" content="ReviseIQ — a calm, Notion-style revision workspace for GCSE subjects, notes and exam countdowns." />
<meta name="theme-color" content="#FAF9F6" />
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<link rel="stylesheet" href="/styles/base.css" />
<link rel="stylesheet" href="/styles/sidebar.css" />
<link rel="stylesheet" href="/styles/main.css" />
<link rel="stylesheet" href="/styles/blocks.css" />
<link rel="stylesheet" href="/styles/overlays.css" />
<link rel="stylesheet" href="/styles/icons.css" />
<link rel="stylesheet" href="/styles/toc.css" />
<link rel="stylesheet" href="/styles/revise.css" />
<link rel="stylesheet" href="/styles/today.css" />
<link rel="stylesheet" href="/styles/plan.css" />
<link rel="stylesheet" href="/styles/exam.css" />
<link rel="stylesheet" href="/styles/quiz.css" />
<link rel="stylesheet" href="/styles/practise.css" />
<link rel="stylesheet" href="/styles/cloud.css" />
<link rel="stylesheet" href="/styles/mobile.css" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="ReviseIQ" />
<meta name="mobile-web-app-capable" content="yes" />
</head>
<body>
<div id="app">
  <div class="mobile-bar" id="mobile-bar">
    <button class="mobile-bar-btn" id="mobile-menu-btn" aria-label="Open menu">
      <svg class="ui-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <div class="mobile-bar-title"><img src="/assets/logo-128.png" alt="" width="22" height="22" /> ReviseIQ</div>
    <button class="mobile-bar-btn" id="mobile-today-btn" aria-label="Plan">
      <svg class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="4.4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="mobile-bar-btn" id="mobile-revise-btn" aria-label="Flashcards">
      <svg class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="11" rx="2"/><path d="M7 3.8h11.5A2.5 2.5 0 0 1 21 6.3v10"/><path d="M7.5 10.5h5M7.5 13.5h3"/></svg>
      <span class="due-pill" id="due-pill-mobile" hidden>0</span>
    </button>
  </div>
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><img src="/assets/logo-128.png" alt="ReviseIQ" width="26" height="26" /></div>
      <div class="brand-name">ReviseIQ</div>
    </div>
    <div class="brand-sub" id="brand-sub">Your revision space</div>
    <button class="calendar-nav-btn" id="today-nav-btn" title="Your revision plan for today">
      <span class="calendar-nav-icon"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="4.4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg></span>
      <span>Plan</span>
    </button>
    <div id="next-exam-slot"></div>
    <button class="calendar-nav-btn" id="calendar-nav-btn">
      <span class="calendar-nav-icon"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg></span>
      <span>Exam calendar</span>
    </button>
    <button class="calendar-nav-btn" id="revise-nav-btn" title="Test yourself on your flashcards">
      <span class="calendar-nav-icon"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="11" rx="2"/><path d="M7 3.8h11.5A2.5 2.5 0 0 1 21 6.3v10"/><path d="M7.5 10.5h5M7.5 13.5h3"/></svg></span>
      <span>Flashcards</span>
      <span class="due-pill" id="due-pill" hidden>0</span>
    </button>
    <div class="sidebar-divider"></div>
    <div class="sidebar-scroll" id="sidebar-tree"></div>
    <div id="cloud-slot"></div>
    <div class="save-status" id="save-status"><span class="save-dot"></span><span id="save-status-text">Loading…</span></div>
    <div class="sidebar-footer">
      <button class="btn-new-subject" id="btn-new-subject">
        <svg class="ui-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New subject
      </button>
      <div class="backup-row">
        <button class="backup-btn" id="btn-export" title="Download a JSON backup of everything">
          <svg class="ui-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><polyline points="7.5 10.5 12 15 16.5 10.5"/><path d="M4.5 19h15"/></svg>
          Export
        </button>
        <button class="backup-btn" id="btn-import" title="Restore from a backup file">
          <svg class="ui-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V8"/><polyline points="7.5 12.5 12 8 16.5 12.5"/><path d="M4.5 20h15"/></svg>
          Import
        </button>
        <input type="file" id="import-input" accept="application/json,.json" hidden />
      </div>
    </div>
  </div>
  <div class="main" id="main">
    <div class="main-inner" id="main-inner"></div>
  </div>
  <aside class="toc-rail" id="toc-rail" aria-label="Table of contents"></aside>
</div>
<div class="sidebar-scrim" id="sidebar-scrim"></div>
<div id="overlay-root"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
